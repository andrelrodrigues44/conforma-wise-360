name: CONFORMA360 Sales Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1-5"

permissions:
  contents: read

jobs:
  prepare-followups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SDR IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SUPABASE_MARKETING_URL: ${{ secrets.SUPABASE_MARKETING_URL }}
          SUPABASE_MARKETING_KEY: ${{ secrets.SUPABASE_MARKETING_KEY }}
        run: node scripts/sales-engine.mjs
