name: CONFORMA360 Marketing Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "marketing/generated/**"
      - "marketing/brand/**"
      - "scripts/validate-marketing-content.mjs"

permissions:
  contents: read

concurrency:
  group: conforma360-marketing-quality-gate
  cancel-in-progress: true

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate generated marketing content
        run: node scripts/validate-marketing-content.mjs
