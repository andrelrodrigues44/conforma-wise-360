name: CONFORMA360 Marketing - Reparar Criativos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-creative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Sharp
        run: npm install --no-save sharp

      - name: Identificar criativos disponíveis
        id: creative-date
        shell: bash
        run: |
          LATEST_DATE=$(find marketing/generated -maxdepth 1 -type f -name '*-criativo-*.svg' -printf '%f\n' | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2})-.*/\1/' | sort -u | tail -1)
          if [ -z "$LATEST_DATE" ]; then
            echo "Nenhum criativo SVG encontrado em marketing/generated/."
            exit 1
          fi
          echo "data=$LATEST_DATE" >> "$GITHUB_OUTPUT"
          echo "Criativos encontrados para a data: $LATEST_DATE"

      - name: Reparar e sincronizar criativos
        env:
          MARKETING_SUPABASE_URL: ${{ secrets.MARKETING_SUPABASE_URL }}
          MARKETING_SUPABASE_KEY: ${{ secrets.MARKETING_SUPABASE_KEY }}
          CONFORMA360_LOGO_URL: ${{ vars.CONFORMA360_LOGO_URL }}
          MARKETING_CREATIVE_DATE: ${{ steps.creative-date.outputs.data }}
        run: node scripts/sync-marketing-creatives.mjs

      - name: Commit criativos reparados
        run: |
          git config user.name "conforma360-marketing-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/generated/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração local para commitar."
            exit 0
          fi
          git commit -m "fix(marketing): repara criativos com logo incorporada"
          git push
